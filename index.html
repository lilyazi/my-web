.flashcard {

}

.flashcard.flipped .flashcard-inner {
    transform: rotateY(180deg);
}

.flashcard-face {
    position: absolute;
    inset: 0;
    min-height: 155px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

/* 앞면 */

}

            type: "noun",
            gender: "der",
            example: "Der Laden ist geöffnet.",
            korean: "가게가 열려 있어요."
        },
        {
            word: "Supermarkt",
            meaning: "슈퍼마켓",
            category: "쇼핑",
            type: "noun",
            gender: "der",
            example: "Ich gehe zum Supermarkt.",
            korean: "슈퍼마켓에 가요."
        },
        {
            word: "kaufen",
            meaning: "사다",
            category: "생활 동사",
            type: "verb",
            gender: "",
            example: "Ich möchte das kaufen.",
            korean: "이것을 사고 싶어요."
        },
        {
            word: "bezahlen",
            meaning: "지불하다",
            category: "생활 동사",
            type: "verb",
            gender: "",
            example: "Wo kann ich bezahlen?",
            korean: "어디에서 결제하나요?"
        },
        {
            word: "teuer",
            meaning: "비싼",
            category: "쇼핑",
            type: "adj",
            gender: "",
            example: "Das ist zu teuer.",
            korean: "그건 너무 비싸요."
        },
        {
            word: "billig",
            meaning: "싼",
            category: "쇼핑",
            type: "adj",
            gender: "",
            example: "Das ist billig.",
            korean: "그건 저렴해요."
        },
        {
            word: "offen",
            meaning: "열려 있는",
            category: "생활",
            type: "adj",
            gender: "",
            example: "Ist der Laden offen?",
            korean: "가게가 열려 있나요?"
        }
    ];

    /* =====================================================
       데이터 검증
    ===================================================== */

    const TOTAL_WORDS = words.length;

    document.getElementById("totalWordCount").textContent = TOTAL_WORDS;


    /* =====================================================
       상태
    ===================================================== */

    let currentIndex =
        Number(localStorage.getItem("germanCurrentIndex")) || 0;

    let completedWords =
        JSON.parse(localStorage.getItem("germanCompleted")) || [];

    let importantWords =
        JSON.parse(localStorage.getItem("germanImportant")) || [];


    /* =====================================================
       저장
    ===================================================== */

    function saveCurrentPosition() {
        localStorage.setItem(
            "germanCurrentIndex",
            currentIndex
        );
    }

    function saveCompleted() {
        localStorage.setItem(
            "germanCompleted",
            JSON.stringify(completedWords)
        );
    }

    function saveImportant() {
        localStorage.setItem(
            "germanImportant",
            JSON.stringify(importantWords)
        );
    }


    /* =====================================================
       성(性) 표시
    ===================================================== */

    function renderGender(current) {
        const row = document.getElementById("genderRow");

        row.innerHTML = "";

        if (!current.gender) {
            return;
        }

        const badge = document.createElement("span");

        badge.className =
            "gender-badge gender-" + current.gender;

        const genderNames = {
            der: "DER · 남성",
            die: "DIE · 여성",
            das: "DAS · 중성",
            plural: "DIE · 복수"
        };

        badge.textContent =
            genderNames[current.gender] || current.gender;

        row.appendChild(badge);
    }


    /* =====================================================
       현재 단어 표시
    ===================================================== */

    function renderWord() {
        if (!words.length) {
            return;
        }

        if (
            currentIndex < 0 ||
            currentIndex >= words.length
        ) {
            currentIndex = 0;
        }

        const current = words[currentIndex];

        const flashcard = document.getElementById("flashcard");
const flashcardMeaning = document.getElementById("flashcardMeaning");

if (flashcard) {
    flashcard.classList.remove("flipped");
}

if (flashcardMeaning) {
    flashcardMeaning.textContent = current.meaning;
}

        document.getElementById("category").textContent =
            current.category;

        document.getElementById("word").textContent =
            current.word;

        document.getElementById("meaning").textContent =
            current.meaning;

        document.getElementById("exampleGerman").textContent =
            current.example;

        document.getElementById("exampleKorean").textContent =
            current.korean;

        renderGender(current);
        updateCompleteButton();
        updateImportantButton();
    }


    /* =====================================================
       독일어 음성 찾기
    ===================================================== */

    let germanVoice = null;

    function loadGermanVoice() {
        if (!("speechSynthesis" in window)) {
            return;
        }

        const voices =
            window.speechSynthesis.getVoices();

        if (!voices.length) {
            return;
        }

        const germanVoices = voices.filter(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("de")
        );

        if (!germanVoices.length) {
            germanVoice = null;
            return;
        }

        /* 독일(Germany) 음성을 우선합니다. */
        germanVoice =
            germanVoices.find(
                voice =>
                    voice.lang
                        .toLowerCase() === "de-de"
            ) ||
            germanVoices.find(
                voice =>
                    voice.name
                        .toLowerCase()
                        .includes("german")
            ) ||
            germanVoices[0];
    }

    if ("speechSynthesis" in window) {
        loadGermanVoice();

        window.speechSynthesis.onvoiceschanged =
            loadGermanVoice;
    }


    /* =====================================================
       독일어 발음
    ===================================================== */

    function speakText(text) {
        if (!("speechSynthesis" in window)) {
            alert(
                "이 브라우저에서는 음성 기능을 사용할 수 없어요."
            );
            return;
        }

        /* 기존 음성을 먼저 취소합니다. */
        window.speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(text);

        /* 반드시 독일어로 지정 */
        speech.lang = "de-DE";

        /* 독일어 음성이 발견되면 직접 지정 */
        if (germanVoice) {
            speech.voice = germanVoice;
        }

        /* 초보자가 발음을 듣기 쉽게 합니다. */
        speech.rate = 0.70;
        speech.pitch = 1.0;
        speech.volume = 1.0;

        const button =
            document.getElementById("soundButton");

        button.classList.add("speaking");

        speech.onend = () => {
            button.classList.remove("speaking");
        };

        speech.onerror = () => {
            button.classList.remove("speaking");
        };

        window.speechSynthesis.speak(speech);
    }

    function speakCurrentWord() {
        const current = words[currentIndex];

        /*
           명사는 관사까지 같이 읽어줍니다.
           예:
           der Bahnhof
           die Familie
           das Haus
        */

        let pronunciation = current.word;

        if (
            current.gender === "der" ||
            current.gender === "die" ||
            current.gender === "das"
        ) {
            pronunciation =
                current.gender + " " + current.word;
        }

        speakText(pronunciation);
    }


    /* =====================================================
       완료
    ===================================================== */

    function toggleComplete() {
        const word =
            words[currentIndex].word;

        if (completedWords.includes(word)) {
            completedWords =
                completedWords.filter(
                    item => item !== word
                );
        } else {
            completedWords.push(word);
        }

        saveCompleted();
        updateCompleteButton();
        updateProgress();
    }


    /* =====================================================
       완료 버튼
    ===================================================== */

    function updateCompleteButton() {
        const button =
            document.getElementById("completeButton");

        const word =
            words[currentIndex].word;

        if (completedWords.includes(word)) {
            button.textContent = "✓ 학습 완료";
            button.classList.add("done");
        } else {
            button.textContent = "✓ 알겠어요";
            button.classList.remove("done");
        }
    }


    /* =====================================================
       중요 단어
    ===================================================== */

    function toggleImportant() {
        const word =
            words[currentIndex].word;

        if (importantWords.includes(word)) {
            importantWords =
                importantWords.filter(
                    item => item !== word
                );
        } else {
            importantWords.push(word);
        }

        saveImportant();
        updateImportantButton();
    }

    function updateImportantButton() {
        const button =
            document.getElementById("importantButton");

        const word =
            words[currentIndex].word;

        if (importantWords.includes(word)) {
            button.textContent = "★ 중요 단어";
            button.classList.add("active");
        } else {
            button.textContent = "☆ 중요 단어";
            button.classList.remove("active");
        }
    }


    /* =====================================================
       다음 단어

       scrollTo() 없음.
       따라서 현재 보고 있던 위치를 그대로 유지합니다.
    ===================================================== */

    function nextWord() {
        currentIndex++;

        if (currentIndex >= words.length) {
            currentIndex = 0;

            alert(
                `🎉 ${words.length}개 단어를 모두 살펴봤어요!`
            );
        }

        saveCurrentPosition();
        renderWord();
    }


    /* =====================================================
       이전 단어

       scrollTo() 없음.
       따라서 이전 버튼을 눌러도 화면이 위로 올라가지 않습니다.
    ===================================================== */

    function previousWord() {
        currentIndex--;

        if (currentIndex < 0) {
            currentIndex = words.length - 1;
        }

        saveCurrentPosition();
        renderWord();
    }


    /* =====================================================
       진행률
    ===================================================== */

    function updateProgress() {
        const completed =
            completedWords.filter(
                word =>
                    words.some(
                        item => item.word === word
                    )
            ).length;

        const percent =
            words.length === 0
                ? 0
                : Math.round(
                    completed / words.length * 100
                );

        document.getElementById(
            "completedCount"
        ).textContent = completed;

        document.getElementById(
            "progressPercent"
        ).textContent = percent + "%";

        document.getElementById(
            "progressFill"
        ).style.width = percent + "%";
    }


    /* =====================================================
       메뉴
    ===================================================== */

    function showMessage(name) {
        if (name === "홈") {
            return;
        }

        alert(
            `${name} 메뉴는 다음 단계에서 만들어볼게요 😊`
        );
    }


    /* =====================================================
       복습

       랜덤한 미완료 단어로 이동합니다.
       scrollTo()를 사용하지 않습니다.
    ===================================================== */

    function showReview() {
        const incomplete =
            words.filter(
                word =>
                    !completedWords.includes(
                        word.word
                    )
            );

        if (incomplete.length === 0) {
            alert("🎉 모든 단어를 완료했어요!");
            return;
        }

        const randomIndex =
            Math.floor(
                Math.random() * incomplete.length
            );

        currentIndex =
            words.indexOf(
                incomplete[randomIndex]
            );

        saveCurrentPosition();
        renderWord();
    }


    /* =====================================================
       단어장
    ===================================================== */

    function showVocabulary() {
        const important =
            words.filter(
                word =>
                    importantWords.includes(
                        word.word
                    )
            );

        if (important.length === 0) {
            alert(
                "아직 중요 단어가 없어요.\n" +
                "⭐ 중요 단어 버튼을 눌러보세요!"
            );

            return;
        }

        const list =
            important
                .map(item => {
                    const article =
                        item.gender
                            ? item.gender + " "
                            : "";

                    return (
                        article +
                        item.word +
                        " — " +
                        item.meaning
                    );
                })
                .join("\n");

        alert(
            "⭐ 나의 중요 단어\n\n" +
            list
        );
    }


    /* =====================================================
       시작
    ===================================================== */

    if (
        currentIndex < 0 ||
        currentIndex >= words.length
    ) {
        currentIndex = 0;
    }

    renderWord();
    updateProgress();

    /* =====================================================
   🃏 플래시카드
   ===================================================== */

function flipFlashcard() {

    const card = document.getElementById("flashcard");

    if (!card) {
        return;
    }

    card.classList.toggle("flipped");
}


/* =====================================================
   플래시카드 클릭
   ===================================================== */

document.addEventListener("DOMContentLoaded", function () {

    const card = document.getElementById("flashcard");

    if (!card) {
        return;
    }

    card.addEventListener("click", function () {
        flipFlashcard();
    });

});



</script>
