<!DOCTYPE html>
<html lang="ko">
<head>
 
<link rel="apple-touch-
<link rel="preconnect" href="https://fonts.googleapis.com">
 
<meta charset="UTF-8">
 
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">
 
<meta name="theme-color" content="#dceeff">
 
<title>Deutsch Schritt für Schritt</title>

<style>

/* =====================================================
   기본 설정
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {   font-family: 'Jua', sans-serif;

    color: #405a86;

    background:
        linear-gradient(
            180deg,
            #cfeaff 0%,
            #e9f6ff 45%,
            #f8f7ff 100%
        );
}


/* =====================================================
   전체 앱
===================================================== */

.app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: 0 auto;

    position: relative;

    overflow: hidden;
}


/* =====================================================
   하늘 배경
===================================================== */

.sky-decoration {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}


/* 구름 */

.cloud {
    position: absolute;

    width: 130px;
    height: 50px;

    background: rgba(255,255,255,0.62);

    border-radius: 60px;

    filter: blur(0.2px);
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background: rgba(255,255,255,0.62);

    border-radius: 50%;
}

.cloud::before {
    width: 65px;
    height: 65px;

    left: 20px;
    bottom: 10px;
}

.cloud::after {
    width: 55px;
    height: 55px;

    right: 18px;
    bottom: 8px;
}

.cloud.one {
    top: 25px;
    left: -65px;
}

.cloud.two {
    top: 170px;
    right: -65px;

    transform: scale(.8);
}

.cloud.three {
    top: 430px;
    left: -75px;

    transform: scale(.7);
}

.cloud.four {
    top: 900px;
    right: -65px;

    transform: scale(.75);
}


/* 별 */

.star {
    position: absolute;

    color: #ffe27d;

    font-size: 25px;

    opacity: .85;

    animation: sparkle 3s ease-in-out infinite;
}

.star.one {
    top: 145px;
    left: 20px;
}

.star.two {
    top: 220px;
    right: 25px;

    font-size: 18px;

    animation-delay: .8s;
}

.star.three {
    top: 590px;
    left: 18px;

    font-size: 17px;

    animation-delay: 1.4s;
}

.star.four {
    top: 850px;
    right: 18px;

    animation-delay: .5s;
}


@keyframes sparkle {

    0%,
    100% {
        opacity: .45;
        transform: scale(.85);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}


/* 하트 */

.heart {
    position: absolute;

    color: #ffabc9;

    font-size: 22px;

    opacity: .7;
}

.heart.one {
    top: 105px;
    right: 28px;
}

.heart.two {
    top: 365px;
    left: 25px;
}

.heart.three {
    top: 660px;
    right: 24px;
}


/* =====================================================
   실제 콘텐츠
===================================================== */

.content {
    position: relative;

    z-index: 2;

    padding-bottom: 110px;
}


/* =====================================================
   헤더
===================================================== */

header {
    position: relative;

    min-height: 278px;

    padding:
        32px
        24px
        20px;
}


/* 로고 */

.logo {
    display: flex;

    align-items: center;

    gap: 8px;

    position: relative;

    z-index: 3;
}


.flag {
    width: 40px;
    height: 40px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 5px 15px
        rgba(70,110,170,.10);

    font-size: 22px;
}


.brand-text {
    font-size: 21px;

    font-weight: 900;

    line-height: 1.05;

    color: #4b73b2;

    letter-spacing: -.6px;
}


.brand-sub {
    margin-top: 4px;

    font-size: 20px;

    font-weight: 900;

    color: #5078b9;

    letter-spacing: -.7px;
}


.brand-heart {
    color: #ff9fc1;

    margin-left: 2px;
}


/* 소개 문구 */

.hero-title {

    margin-top: 22px;

    font-size: 25px;

    font-weight: 900;

    letter-spacing: -1px;

    color: #355b96;
}


.hero-subtitle {

    margin-top: 7px;

    font-size: 14px;

    line-height: 1.55;

    color: #6684ad;
}


/* 캐릭터 */

.hero-character {

    position: absolute;

    width: 165px;
    height: 165px;

    object-fit: contain;

    right: 2px;
    top: 74px;

    z-index: 1;

    filter:
        drop-shadow(
            0 8px 12px
            rgba(90,130,180,.10)
        );
}


/* 이미지가 없을 때 */

.hero-fallback {

    position: absolute;

    right: 24px;
    top: 95px;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    background: rgba(255,255,255,.45);

    display: none;

    align-items: center;
    justify-content: center;

    font-size: 55px;
}


/* 말풍선 */

.lucky-bubble {

    position: absolute;

    right: 18px;
    top: 30px;

    padding: 10px 14px;

    border-radius: 25px;

    background: rgba(255,255,255,.8);

    border: 2px solid #a7d0fa;

    color: #76a4df;

    font-weight: 900;

    font-size: 14px;

    text-align: center;

    z-index: 4;
}


/* =====================================================
   오늘의 학습
===================================================== */

.progress-card {

    margin:
        -18px
        18px
        20px;

    padding:
        20px
        20px
        22px;

    position: relative;

    z-index: 5;

    border-radius: 28px;

    background:
        rgba(255,255,255,.91);

    box-shadow:
        0 8px 25px
        rgba(76,116,175,.12);

    border:
        1px solid
        rgba(255,255,255,.8);
}


.progress-heading {

    display: flex;

    align-items: center;

    justify-content: space-between;
}


.progress-left {

    display: flex;

    align-items: center;

    gap: 9px;
}


.calendar {

    font-size: 24px;
}


.progress-title {

    font-size: 19px;

    font-weight: 900;

    color: #405f91;
}


.progress-count {

    font-size: 13px;

    color: #5977a4;

    font-weight: 700;
}


.progress-number {

    color: #375b94;

    font-weight: 900;
}


.progress-track {

    margin-top: 15px;

    width: 100%;

    height: 11px;

    background: #dce8f8;

    border-radius: 20px;

    overflow: hidden;
}


.progress-fill {

    width: 0%;

    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #6591ea,
            #8db4ff
        );

    transition:
        width .45s ease;
}


.progress-percent {

    margin-top: 7px;

    text-align: right;

    font-size: 13px;

    color: #5375ad;

    font-weight: 800;
}


/* =====================================================
   단어 카드
===================================================== */

.word-card {

    margin:
        0
        18px
        20px;

    padding:
        22px
        18px
        18px;

    position: relative;

    z-index: 5;

    border-radius: 30px;

    background:
        rgba(255,255,255,.96);

    box-shadow:
        0 10px 32px
        rgba(65,105,165,.14);

    border:
        1px solid
        rgba(255,255,255,.9);
}


/* 카드 위쪽 */

.card-top {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}


.category {

    padding:
        8px
        17px;

    border-radius: 30px;

    background:
        #e4f5ff;

    color: #5980ba;

    font-size: 13px;

    font-weight: 800;
}


.important {

    border: none;

    background:
        #fff0f2;

    color: #ed849d;

    padding:
        8px
        14px;

    border-radius: 25px;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;
}


.important.active {

    background:
        #ffe0e8;

    color: #e76b8a;
}


/* 단어 */

.word {

    text-align: center;

    font-size: 43px;

    line-height: 1.15;

    font-weight: 900;

    color: #31568f;

    letter-spacing: -1.5px;
}


.meaning {

    margin-top: 6px;

    text-align: center;

    font-size: 21px;

    color: #61799f;

    font-weight: 600;
}


/* 캐릭터 + 발음 */

.word-character-area {

    min-height: 130px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-top: 7px;
}


.small-character {

    position: absolute;

    right: 0;

    bottom: 0;

    width: 125px;

    height: 125px;

    object-fit: contain;

    opacity: .95;

    pointer-events: none;
}


/* 발음 버튼 */

.sound-button {

    position: relative;

    z-index: 3;

    width: 50px;
    height: 50px;

    border: none;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #6595ed,
            #86aaff
        );

    color: white;

    font-size: 31px;

    box-shadow:
        0 9px 22px
        rgba(80,125,225,.28);

    cursor: pointer;

    transition:
        transform .12s ease;
}


.sound-button:active {

    transform: scale(.91);
}


.listen-text {

    position: absolute;

    right: 118px;

    bottom: 20px;

    width: 95px;

    color: #6c8ed0;

    font-size: 11px;

    font-weight: 800;

    line-height: 1.25;

    transform: rotate(-8deg);
}


/* =====================================================
   예문
===================================================== */

.example-box {

    margin-top: 4px;

    padding:
        17px;

    border-radius:
        21px;

    background:
        #eef6ff;
}


.example-title {

    display: flex;

    align-items: center;

    gap: 7px;

    margin-bottom: 9px;

    color: #6590d0;

    font-size: 13px;

    font-weight: 900;
}


.example-german {

    color: #3f5f91;

    font-size: 18px;

    font-weight: 800;

    line-height: 1.4;
}


.example-korean {

    margin-top: 5px;

    color: #8798b1;

    font-size: 13px;
}


/* =====================================================
   카드 버튼
===================================================== */

.action-row {

    display: flex;

    gap: 9px;

    margin-top: 16px;
}


.complete-button {

    flex: 1;

    min-height: 58px;

    border: none;

    border-radius: 20px;

    background:
        linear-gradient(
            135deg,
            #6791ed,
            #739af1
        );

    color: white;

    font-size: 17px;

    font-weight: 900;

    box-shadow:
        0 6px 14px
        rgba(80,120,220,.20);

    cursor: pointer;
}


.complete-button.done {

    background:
        linear-gradient(
            135deg,
            #57b88a,
            #73c69e
        );
}


.next-button {

    width: 116px;

    min-height: 58px;

    border-radius: 20px;

    border:
        2px solid
        #ffb6ce;

    background:
        #fff8fb;

    color: #df7898;

    font-size: 14px;

    font-weight: 900;

    cursor: pointer;
}


.next-button span {

    display: block;

    font-size: 27px;

    line-height: 20px;

    margin-bottom: 3px;
}


/* =====================================================
   공부 방법
===================================================== */

.study-tip {

    margin:
        0
        18px
        20px;

    padding:
        17px
        17px
        15px;

    position: relative;

    z-index: 5;

    border-radius: 23px;

    background:
        rgba(255,249,218,.96);

    border:
        1px solid
        rgba(255,255,255,.8);
}


.tip-title {

    display: flex;

    align-items: center;

    gap: 8px;

    color: #6c63a0;

    font-size: 17px;

    font-weight: 900;
}


.tip-text {

    margin-top: 7px;

    color: #6c6c78;

    font-size: 12px;

    line-height: 1.65;
}


.tip-character {

    position: absolute;

    width: 100px;
    height: 100px;

    object-fit: contain;

    right: 7px;

    bottom: 2px;
}


/* =====================================================
   하단 메뉴
===================================================== */

.bottom-nav {

    position: fixed;

    bottom: 0;
    left: 50%;

    transform:
        translateX(-50%);

    width:
        min(430px, 100vw);

    min-height: 88px;

    padding:
        10px
        12px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    display: flex;

    justify-content:
        space-around;

    align-items: center;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-top:
        1px solid
        rgba(100,125,170,.10);

    box-shadow:
        0 -5px 20px
        rgba(80,110,160,.08);

    z-index: 50;
}


.nav-button {

    width: 25%;

    border: none;

    background: transparent;

    color: #7284a3;

    font-size: 12px;

    font-weight: 700;

    cursor: pointer;

    padding: 7px 0;

    border-radius: 22px;
}


.nav-icon {

    display: block;

    font-size: 26px;

    line-height: 30px;

    margin-bottom: 3px;
}


.nav-button.active {

    color: #527bd4;

    background:
        #edf3ff;
}


/* =====================================================
   작은 화면
===================================================== */

@media (max-width: 370px) {

    header {
        padding-left: 18px;
        padding-right: 18px;
    }

    .brand-text,
    .brand-sub {
        font-size: 18px;
    }

    .hero-character {
        width: 135px;
        height: 135px;
        right: -3px;
    }

    .word {
        font-size: 37px;
    }

    .meaning {
        font-size: 19px;
    }

    .small-character {
        width: 105px;
        height: 105px;
    }

    .listen-text {
        display: none;
    }
}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     배경
===================================================== -->

<div class="sky-decoration">

    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>
    <div class="cloud four"></div>

    <div class="star one">★</div>
    <div class="star two">✦</div>
    <div class="star three">★</div>
    <div class="star four">✦</div>

    <div class="heart one">♡</div>
    <div class="heart two">♡</div>
    <div class="heart three">♡</div>

</div>


<!-- =====================================================
     콘텐츠
===================================================== -->

<div class="content">


<!-- =====================================================
     헤더
===================================================== -->

<header>

    <div class="logo">

        <div class="flag">
            🇩🇪
        </div>

        <div>

            <div class="brand-text">
                Deutsch <span class="brand-heart">♥</span>
            </div>

            <div class="brand-sub">
                Schritt für Schritt
            </div>

        </div>

    </div>


    <div class="hero-title">
        루하와 하루 독일어
    </div>


    <div class="hero-subtitle">
        하루 한 걸음씩,<br>
        독일어와 가까워지자자!
    </div>


    <div class="lucky-bubble">
        Viel<br>
        Glück!
    </div>


    <!--
        이 파일은 프로젝트 폴더에
        cinnamoroll.png 라는 이름으로 넣어주세요.
    -->

    <img
        src="snimages.png"
        class="hero-character"
        alt="캐릭터"
        onerror="this.style.display='none'; document.querySelector('.hero-fallback').style.display='flex';"
    >


    <div class="hero-fallback">
        
    </div>

</header>



<!-- =====================================================
     오늘의 학습
===================================================== -->

<section class="progress-card">

    <div class="progress-heading">

        <div class="progress-left">

            <span class="calendar">
                🗓️
            </span>

            <span class="progress-title">
                오늘의 학습
            </span>

        </div>


        <div class="progress-count">

            <span
                class="progress-number"
                id="completedCount">
                0
            </span>

            / 100 단어 완료

        </div>

    </div>


    <div class="progress-track">

        <div
            class="progress-fill"
            id="progressFill">
        </div>

    </div>


    <div
        class="progress-percent"
        id="progressPercent">
        0%
    </div>

</section>



<!-- =====================================================
     단어 카드
===================================================== -->

<section class="word-card">


    <div class="card-top">

        <div
            class="category"
            id="category">
            기본 인사
        </div>


        <button
            class="important"
            id="importantButton"
            onclick="toggleImportant()">

            ☆ 중요 단어

        </button>

    </div>


    <div
        class="word"
        id="word">
        Hallo
    </div>


    <div
        class="meaning"
        id="meaning">
        안녕하세요
    </div>


    <div class="word-character-area">

        <button
            class="sound-button"
            onclick="speakCurrentWord()">

            🔊

        </button>

    

        <div class="listen-text">
            발음을 들어보자
        </div>


        <img
            src="sinamo2.png"
            class="small-character"
            alt=""
        >

    </div>



    <!-- 예문 -->

    <div class="example-box">

        <div class="example-title">
            💬 예문
        </div>


        <div
            class="example-german"
            id="exampleGerman">
            Hallo! Wie geht es dir?
        </div>


        <div
            class="example-korean"
            id="exampleKorean">
            안녕! 잘 지내?
        </div>

    </div>



    <!-- 버튼 -->

    <div class="action-row">

        <button
            class="complete-button"
            id="completeButton"
            onclick="toggleComplete()">

            ✓ 알겠어요

        </button>


        <button
            class="next-button"
            onclick="nextWord()">

            <span>→</span>

            NEXT

        </button>

    </div>


</section>



<!-- =====================================================
     공부 방법
===================================================== -->

<section class="study-tip">

    <div class="tip-title">
        💡 공부 방법
    </div>


    <div class="tip-text">

        단어를 눈으로 읽고 →
        발음을 들어보고 →
        직접 소리 내어 <br> 말해보세요.

        익숙해졌다면
        <strong>알겠어요</strong>를 눌러주세요!

    </div>


    <img
        src="sinamo1.png"
        class="tip-character"
        alt=""
    >

</section>


</div>



<!-- =====================================================
     하단 메뉴
===================================================== -->

<nav class="bottom-nav">

    <button
        class="nav-button active"
        onclick="showMessage('홈')">

        <span class="nav-icon">
            🏠
        </span>

        홈

    </button>


    <button
        class="nav-button"
        onclick="showMessage('학습')">

        <span class="nav-icon">
            📖
        </span>

        학습

    </button>


    <button
        class="nav-button"
        onclick="showReview()">

        <span class="nav-icon">
            🔄
        </span>

        복습

    </button>


    <button
        class="nav-button"
        onclick="showVocabulary()">

        <span class="nav-icon">
            ☆
        </span>

        단어장

    </button>

</nav>


</div>



<script>

/* =====================================================
   독일어 100개
===================================================== */

const words = [

/* 01 인사 */

{
    word:"Hallo",
    meaning:"안녕하세요",
    category:"기본 인사",
    example:"Hallo! Wie geht es dir?",
    korean:"안녕! 잘 지내?"
},

{
    word:"Danke",
    meaning:"감사합니다",
    category:"기본 인사",
    example:"Danke für deine Hilfe.",
    korean:"도와줘서 고마워."
},

{
    word:"Bitte",
    meaning:"부탁합니다 / 천만에요",
    category:"기본 표현",
    example:"Bitte schön.",
    korean:"여기 있습니다 / 천만에요."
},

{
    word:"Entschuldigung",
    meaning:"실례합니다 / 죄송합니다",
    category:"기본 표현",
    example:"Entschuldigung, wo ist der Bahnhof?",
    korean:"실례합니다, 기차역이 어디예요?"
},

{
    word:"Ja",
    meaning:"네",
    category:"기초 단어",
    example:"Ja, gerne.",
    korean:"네, 좋아요."
},

{
    word:"Nein",
    meaning:"아니요",
    category:"기초 단어",
    example:"Nein, danke.",
    korean:"아니요, 괜찮아요."
},

{

/* =====================================================
   상태
===================================================== */

let currentIndex = 0;

let completedWords =
    JSON.parse(
        localStorage.getItem(
            "germanCompleted"
        )
    ) || [];


let importantWords =
    JSON.parse(
        localStorage.getItem(
            "germanImportant"
        )
    ) || [];


/* =====================================================
   현재 단어 표시
===================================================== */

function renderWord() {

    const current =
        words[currentIndex];


    document.getElementById("category")
        .textContent =
        current.category;


    document.getElementById("word")
        .textContent =
        current.word;


    document.getElementById("meaning")
        .textContent =
        current.meaning;


    document.getElementById("exampleGerman")
        .textContent =
        current.example;


    document.getElementById("exampleKorean")
        .textContent =
        current.korean;


    updateCompleteButton();

    updateImportantButton();

}


/* =====================================================
   독일어 발음
===================================================== */

function speakText(text) {

    if (!("speechSynthesis" in window)) {

        alert(
            "이 브라우저에서는 음성 기능을 사용할 수 없어요."
        );

        return;
    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang = "de-DE";

    speech.rate = 0.78;

    speech.pitch = 1;


    window.speechSynthesis.speak(
        speech
    );

}


function speakCurrentWord() {

    speakText(
        words[currentIndex].word
    );

}


/* =====================================================
   완료 처리
===================================================== */

function toggleComplete() {

    const word =
        words[currentIndex].word;


    if (
        completedWords.includes(word)
    ) {

        completedWords =
            completedWords.filter(
                item => item !== word
            );

    } else {

        completedWords.push(word);

    }


    localStorage.setItem(
        "germanCompleted",
        JSON.stringify(
            completedWords
        )
    );


    updateCompleteButton();

    updateProgress();

}


/* =====================================================
   완료 버튼 상태
===================================================== */

function updateCompleteButton() {

    const button =
        document.getElementById(
            "completeButton"
        );


    const word =
        words[currentIndex].word;


    if (
        completedWords.includes(word)
    ) {

        button.textContent =
            "✓ 학습 완료";

        button.classList.add(
            "done"
        );

    } else {

        button.textContent =
            "✓ 알겠어요";

        button.classList.remove(
            "done"
        );

    }

}


/* =====================================================
   중요 단어
===================================================== */

function toggleImportant() {

    const word =
        words[currentIndex].word;


    if (
        importantWords.includes(word)
    ) {

        importantWords =
            importantWords.filter(
                item => item !== word
            );

    } else {

        importantWords.push(word);

    }


    localStorage.setItem(
        "germanImportant",
        JSON.stringify(
            importantWords
        )
    );


    updateImportantButton();

}


function updateImportantButton() {

    const button =
        document.getElementById(
            "importantButton"
        );


    const word =
        words[currentIndex].word;


    if (
        importantWords.includes(word)
    ) {

        button.textContent =
            "★ 중요 단어";

        button.classList.add(
            "active"
        );

    } else {

        button.textContent =
            "☆ 중요 단어";

        button.classList.remove(
            "active"
        );

    }

}


/* =====================================================
   다음 단어
===================================================== */

function nextWord() {

    currentIndex++;

    if (
        currentIndex >= words.length
    ) {

        currentIndex = 0;

        alert(
            "100개 단어를 모두 살펴봤어요! 🎉"
        );

    }


    renderWord();

}

function updateProgress() {

    const completed =
        completedWords.filter(
            word =>
                words.some(
                    item =>
                        item.word === word
                )
        ).length;


    const percent =
        Math.round(
            completed /
            words.length *
            100
        );


    document.getElementById(
        "completedCount"
    ).textContent =
        completed;


    document.getElementById(
        "progressPercent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "progressFill"
    ).style.width =
        percent + "%";

}


/* =====================================================
   메뉴
===================================================== */

function showMessage(name) {

    if (name === "홈") {
        return;
    }


    alert(
        `${name} 메뉴는 다음 단계에서 만들어볼게요 😊`
    );

}


function showReview() {

    const incomplete =
        words.filter(
            word =>
                !completedWords.includes(
                    word.word
                )
        );


    if (
        incomplete.length === 0
    ) {

        alert(
            "🎉 모든 단어를 완료했어요!"
        );

        return;
    }


    const randomIndex =
        Math.floor(
            Math.random() *
            incomplete.length
        );


    currentIndex =
        words.indexOf(
            incomplete[randomIndex]
        );


    renderWord();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function showVocabulary() {

    const important =
        words.filter(
            word =>
                importantWords.includes(
                    word.word
                )
        );


    if (
        important.length === 0
    ) {

        alert(
            "아직 중요 단어가 없어요.\n⭐ 중요 단어 버튼을 눌러보세요!"
        );

        return;
    }


    const list =
        important
            .map(
                item =>
                    `${item.word} — ${item.meaning}`
            )
            .join("\n");


    alert(
        "⭐ 나의 중요 단어\n\n" +
        list
    );

}
